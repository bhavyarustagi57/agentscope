[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-api"
version = "0.1.0"
description = "AgentScope control plane and worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "dramatiq[redis]>=1.17,<3",
  "fastapi>=0.115,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
agentscope-preflight = "agentscope_api.preflight:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentscope_api"]
plugins = ["pydantic.mypy"]
