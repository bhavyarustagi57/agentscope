[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-tracing"
version = "0.4.0"
description = "Vendor-neutral tracing SDK for AI agent applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentScope contributors" }]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2"]
openai = ["openai>=2,<3"]

[dependency-groups]
dev = [
  "langgraph>=1.2,<2",
  "mypy>=1.15,<2",
  "openai>=2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentscope_sdk"]
